spring.application.name=cube
server.port=8080
# Same path as the WebLogic deployment (cube.war -> /cube). Ignored when deployed as a WAR.
server.servlet.context-path=/cube

# ---------------------------------------------------------------
# Everything needed to run is in this WAR: WebLogic needs no extra settings.
# Secrets (GitHub token, JWT secret) live in cube-secrets.properties next to this file:
# it is bundled into cube.war but git-ignored, so it is never pushed to GitHub.
# Any value can still be overridden on a server with -DNAME=value (e.g. -DCUBE_DB_PASSWORD=...).
# ---------------------------------------------------------------
spring.config.import=optional:classpath:cube-secrets.properties

# Oracle
spring.datasource.url=${CUBE_DB_URL:jdbc:oracle:thin:@//10.20.5.10:1521/FCUBS147X}
spring.datasource.username=${CUBE_DB_USERNAME:CUBEDB}
spring.datasource.password=${CUBE_DB_PASSWORD:CUBEDB}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Fail fast (instead of hanging ~30s) when the database is unreachable, e.g. VPN disconnected
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# JPA / Hibernate (schema is managed by the scripts in db/oracle)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JSON / errors
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
server.error.include-stacktrace=never

# JWT (the real secret is in cube-secrets.properties; empty = random per restart)
jwt.secret=${CUBE_JWT_SECRET:}
jwt.expiration=3600000

# Login protection (per username)
cube.security.login.max-attempts=5
cube.security.login.lock-minutes=15

# CORS - only needed when the frontend runs on a different origin (local dev).
# Comma-separated, e.g. http://localhost:5173. Leave empty in production (same origin).
cube.cors.allowed-origins=${CUBE_CORS_ALLOWED_ORIGINS:}

# Uploads: 10MB per file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=210MB
cube.upload.max-file-size-bytes=10485760
cube.upload.max-files-per-request=20

# Search: oracle-text (production) or like (fallback, no Oracle Text index needed)
cube.search.mode=${CUBE_SEARCH_MODE:oracle-text}

# ---------------------------------------------------------------
# File storage: github (attachments go to the private repo below) | local (server disk, testing only)
# The token is in cube-secrets.properties.
# ---------------------------------------------------------------
cube.storage.type=${CUBE_STORAGE_TYPE:github}
cube.storage.github.api-url=https://api.github.com
cube.storage.github.owner=${CUBE_GITHUB_OWNER:103sunil}
cube.storage.github.repo=${CUBE_GITHUB_REPO:cube-attachments}
cube.storage.github.branch=${CUBE_GITHUB_BRANCH:main}
cube.storage.github.token=${CUBE_GITHUB_TOKEN:CHANGE_ME_GITHUB_TOKEN}
cube.storage.github.base-path=attachments
cube.storage.local.base-dir=${CUBE_LOCAL_STORAGE_DIR:${user.home}/cube-files}

# Files uploaded by the PREVIOUS version of Cube were saved on the disks of the machines that ran it
# (e.g. D:\cube\local-storage\knowledge-61\...). Copy those "local-storage" folders to the server and
# list them here (comma separated) so old attachments can still be downloaded.
cube.storage.legacy-dirs=${CUBE_LEGACY_FILES_DIR:}
