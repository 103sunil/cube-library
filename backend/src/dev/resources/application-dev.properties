# Local development profile - only on the classpath with "mvn ... -Pdev", never in the WAR.
#   mvn spring-boot:run -Pdev -Dspring-boot.run.profiles=dev
# In-memory H2 (data is lost on restart), files on local disk, simple LIKE search.
spring.datasource.url=jdbc:h2:mem:cube;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Load demo users and sample articles after Hibernate has created the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:dev-data.sql

jwt.secret=dev-only-secret-dev-only-secret-0123456789

cube.search.mode=like
cube.storage.type=local
cube.storage.local.base-dir=${java.io.tmpdir}/cube-dev-files
