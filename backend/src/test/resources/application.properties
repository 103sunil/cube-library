spring.application.name=cube-test
# Same as production; MockMvc ignores the context path.
server.servlet.context-path=/cube

spring.datasource.url=jdbc:h2:mem:cube;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=test-only-secret-test-only-secret-0123456789
jwt.expiration=3600000

cube.security.login.max-attempts=5
cube.security.login.lock-minutes=15
cube.cors.allowed-origins=

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=210MB
cube.upload.max-file-size-bytes=10485760
cube.upload.max-files-per-request=20

cube.search.mode=like
cube.storage.type=local
cube.storage.local.base-dir=${java.io.tmpdir}/cube-test-files
